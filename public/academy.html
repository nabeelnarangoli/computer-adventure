<div id="app"><noscript><main><h1>Aqlyon Academy: online courses with certificates</h1>
<p>Build the skills your career needs, at your own pace, with short lessons, hands-on practice, quizzes and a certificate at the end of each programme. Aqlyon Academy is part of Aqlyon Career Discovery Centre, which offers education consultation and career support for students and families in Kerala and the UAE.</p>
<h2>Courses</h2><ul><li><b>Aqlyon AI Academy</b>: from “What is AI?” to creating images, videos, content, presentations and data reports with AI tools.</li><li><b>AI-Powered Digital Marketing</b>: social media, content planning, advertising, audience research, SEO, analytics and campaign optimisation.</li><li><b>Computer skills for Mac and Windows</b>: files, internet safety, email, Word, PowerPoint, Excel, cloud and security.</li></ul>
<h2>How it works</h2><p>Create a free account in one minute, choose a course and start straight away. Lessons are short and practical, with step-by-step demonstrations, quizzes at the end of each stage and a certificate when you finish. Your progress is saved, so you can learn on your phone or computer whenever it suits you, and subtitles are available in Malayalam, Hindi and Arabic.</p>
<h2>Part of our career support</h2><p>Many students join Aqlyon Academy after an education consultation at Aqlyon Career Discovery Centre, to build the practical skills their chosen career needs. Parents and working adults use it too, to learn AI tools and computer skills for their own work.</p>
<p><a href="/">Education consultation and career help</a> · <a href="/#contact">Contact us</a></p></main></noscript></div>
